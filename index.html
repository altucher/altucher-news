<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Six things in markets today</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      color: #1a1a1a;
      background: #fafaf7;
      line-height: 1.6;
    }
    h1 { font-size: 28px; font-weight: 500; margin: 0 0 4px; }
    .sub { color: #666; font-size: 15px; margin: 0 0 2rem; }
    button {
      font-size: 15px;
      font-weight: 500;
      padding: 10px 20px;
      border: 1px solid #1a1a1a;
      background: #1a1a1a;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #333; }
    button:disabled { opacity: 0.5; cursor: wait; }
    .status { font-size: 13px; color: #888; margin-left: 12px; }
    article {
      padding: 1.5rem 0;
      border-top: 1px solid #e5e5e0;
    }
    .meta { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .num { font-size: 12px; font-weight: 500; color: #aaa; }
    .tag {
      font-size: 12px;
      padding: 2px 10px;
      background: #ececea;
      border-radius: 12px;
      color: #555;
    }
    .tag.weird {
      background: #fff3d6;
      color: #8a5a00;
    }
    h2 { font-size: 19px; font-weight: 500; margin: 0 0 10px; line-height: 1.4; }
    .body {
      font-family: Georgia, serif;
      font-size: 16px;
      line-height: 1.7;
      margin: 0 0 12px;
    }
    .source {
      font-size: 13px;
      color: #888;
    }
    .source a {
      color: #555;
      text-decoration: underline;
    }
    .source a:hover { color: #1a1a1a; }
  </style>
</head>
<body>
  <h1>Six things in markets today</h1>
  <p class="sub">Important. Slightly weird. Worth your morning coffee.</p>

  <div>
    <button id="gen">Generate</button>
    <span id="status" class="status"></span>
  </div>

  <div id="stories"></div>

  <script>
    const btn = document.getElementById("gen");
    const status = document.getElementById("status");
    const stories = document.getElementById("stories");

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      status.textContent = "Scanning the wires...";
      stories.innerHTML = "";
      try {
        const res = await fetch("/api/generate", { method: "POST" });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        stories.innerHTML = data.stories.map((s, i) => {
          const isWeird = s.tag.toLowerCase().includes("weird");
          const tagClass = isWeird ? "tag weird" : "tag";
          const sourceLink = s.source_url
            ? `<p class="source"><a href="${s.source_url}" target="_blank" rel="noopener noreferrer">Read the original →</a></p>`
            : "";
          return `
            <article>
              <div class="meta">
                <span class="num">0${i + 1}</span>
                <span class="${tagClass}">${s.tag}</span>
              </div>
              <h2>${s.headline}</h2>
              <p class="body">${s.body}</p>
              ${sourceLink}
            </article>
          `;
        }).join("");
      } catch (err) {
        status.textContent = "Something went wrong: " + err.message;
      } finally {
        btn.disabled = false;
        if (!status.textContent.startsWith("Something")) status.textContent = "";
      }
    });
  </script>
</body>
</html>
