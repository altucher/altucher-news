<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Six things in markets today</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      color: #1a1a1a;
      background: #fafaf7;
      line-height: 1.6;
    }
    h1 { font-size: 28px; font-weight: 500; margin: 0 0 4px; }
    .sub { color: #666; font-size: 15px; margin: 0 0 1.5rem; }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #e5e5e0;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: 13px;
      padding: 5px 12px;
      background: white;
      border: 1px solid #d5d5d0;
      border-radius: 16px;
      cursor: pointer;
      color: #444;
    }
    .chip:hover { background: #f0f0eb; }
    .chip.active {
      background: #1a1a1a;
      color: white;
      border-color: #1a1a1a;
    }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      font-size: 15px;
      padding: 9px 12px;
      border: 1px solid #d5d5d0;
      border-radius: 8px;
      background: white;
      font-family: inherit;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #1a1a1a;
    }
    button {
      font-size: 15px;
      font-weight: 500;
      padding: 10px 20px;
      border: 1px solid #1a1a1a;
      background: #1a1a1a;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #333; }
    button:disabled { opacity: 0.5; cursor: wait; }
    .status { font-size: 13px; color: #888; margin-top: 8px; }
    .note {
      font-size: 13px;
      color: #8a5a00;
      background: #fff8e6;
      padding: 8px 12px;
      border-radius: 6px;
      margin: 0 0 1rem;
    }
    article {
      padding: 1.5rem 0;
      border-top: 1px solid #e5e5e0;
    }
    article:first-child { border-top: none; padding-top: 0; }
    .meta { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .num { font-size: 12px; font-weight: 500; color: #aaa; }
    .tag {
      font-size: 12px;
      padding: 2px 10px;
      background: #ececea;
      border-radius: 12px;
      color: #555;
    }
    .tag.weird { background: #fff3d6; color: #8a5a00; }
    h2 { font-size: 19px; font-weight: 500; margin: 0 0 10px; line-height: 1.4; }
    .body {
      font-family: Georgia, serif;
      font-size: 16px;
      line-height: 1.7;
      margin: 0 0 12px;
    }
    .source { font-size: 13px; color: #888; }
    .source a { color: #555; text-decoration: underline; }
    .source a:hover { color: #1a1a1a; }
  </style>
</head>
<body>
  <h1>Six things in markets today</h1>
  <p class="sub">Important. Slightly weird. Worth your morning coffee.</p>

  <div class="controls">
    <div class="chips" id="chips"></div>
    <div class="input-row">
      <input type="text" id="filter-input" placeholder="Or type your own filter (e.g. Tesla, oil, Japan)..." />
      <button id="gen">Generate</button>
    </div>
    <span id="status" class="status"></span>
  </div>

  <div id="note-area"></div>
  <div id="stories"></div>

  <script>
    // Fixed chips that always appear
    const FIXED_CHIPS = ["crypto", "AI", "macro", "weird"];

    // Pool of useful rotating categories
    const ROTATING_POOL = [
      "energy", "biotech", "real estate", "commodities", "emerging markets",
      "banking", "semiconductors", "retail", "China", "Japan", "Europe",
      "small caps", "bonds", "FX", "M&A"
    ];

    function pickRandom(arr, n) {
      const shuffled = [...arr].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, n);
    }

    function renderChips() {
      const rotating = pickRandom(ROTATING_POOL, 3);
      const all = [...FIXED_CHIPS, ...rotating];
      const chipsEl = document.getElementById("chips");
      chipsEl.innerHTML = all.map(c =>
        `<button class="chip" data-filter="${c}">${c}</button>`
      ).join("");
      chipsEl.querySelectorAll(".chip").forEach(chip => {
        chip.addEventListener("click", () => {
          const filter = chip.dataset.filter;
          document.getElementById("filter-input").value = filter;
          generate(filter);
        });
      });
    }

    async function generate(filter) {
      const btn = document.getElementById("gen");
      const status = document.getElementById("status");
      const stories = document.getElementById("stories");
      const noteArea = document.getElementById("note-area");

      btn.disabled = true;
      status.textContent = filter ? `Scanning the wires for "${filter}"...` : "Scanning the wires...";
      stories.innerHTML = "";
      noteArea.innerHTML = "";

      // Mark active chip
      document.querySelectorAll(".chip").forEach(c => {
        c.classList.toggle("active", c.dataset.filter === filter);
      });

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filter: filter || null })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        if (data.note) {
          noteArea.innerHTML = `<p class="note">${data.note}</p>`;
        }

        stories.innerHTML = data.stories.map((s, i) => {
          const isWeird = s.tag.toLowerCase().includes("weird");
          const tagClass = isWeird ? "tag weird" : "tag";
          const sourceLink = s.source_url
            ? `<p class="source"><a href="${s.source_url}" target="_blank" rel="noopener noreferrer">Read the original →</a></p>`
            : "";
          return `
            <article>
              <div class="meta">
                <span class="num">0${i + 1}</span>
                <span class="${tagClass}">${s.tag}</span>
              </div>
              <h2>${s.headline}</h2>
              <p class="body">${s.body}</p>
              ${sourceLink}
            </article>
          `;
        }).join("");
        status.textContent = "";

        // Reshuffle the rotating chips for next time
        renderChips();
      } catch (err) {
        status.textContent = "Something went wrong: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById("gen").addEventListener("click", () => {
      const filter = document.getElementById("filter-input").value.trim();
      generate(filter);
    });

    document.getElementById("filter-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        document.getElementById("gen").click();
      }
    });

    // Initial chip render
    renderChips();
  </script>
</body>
</html>
